name: Review reproducibility checks
on:
  push:
  pull_request:
jobs:
  structural-validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate structural checks on synthetic examples
        run: python -m unittest discover -s tests -v
      - name: Validate Python syntax
        run: python -m compileall -q scripts tests

      - name: Reproduce provisional research audits
        run: python reproduce_all.py

      - name: Reproduce comparative outcomes and AMEAF logic
        run: |
          python scripts/reproduce_contrasts.py
          python scripts/ameaf.py
          python scripts/generate_figures.py

      - name: Collect reproducibility outputs
        run: |
          mkdir -p generated
          python reproduce_all.py > generated/register_audit.json
          python scripts/reproduce_contrasts.py > generated/contrasts.json
          python scripts/ameaf.py > generated/ameaf_logic.txt
      - name: Archive reproducibility outputs
        uses: actions/upload-artifact@v4
        with:
          name: provisional-reproducibility-outputs
          path: generated/
          if-no-files-found: error
